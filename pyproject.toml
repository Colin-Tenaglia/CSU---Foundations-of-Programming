[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qb2drake"
version = "1.0.0"
description = "Convert QuickBooks exports into Drake Accounting import files"
readme = "qb2drake/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]

[project.scripts]
qb2drake = "qb2drake.cli:main"

[tool.setuptools]
packages = ["qb2drake", "qb2drake.readers", "qb2drake.writers"]
