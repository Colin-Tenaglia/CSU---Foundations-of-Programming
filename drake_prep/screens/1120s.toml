  { id = "distributions_to_shareholder", box = "16D", label = "Distributions to this shareholder", type = "money" },
  { id = "health_insurance_in_w2", box = "", label = ">2% shareholder health insurance included in W-2 box 1", type = "checkbox", note = "Must be in wages before it is deducted on the 1040." },
