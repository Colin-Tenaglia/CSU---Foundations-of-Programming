multi = true
wp_section = 600
doc_types = ["Form 7203 / basis"]
note = "One instance per shareholder. Ownership percentages must sum to 100 and the days owned must cover the year."
fields = [
  { id = "shareholder_name", box = "", label = "Shareholder name", type = "text", required = true },
  { id = "shareholder_tin", box = "", label = "Shareholder TIN", type = "ssn", required = true },
  { id = "shares_owned", box = "", label = "Shares owned", type = "int" },
  { id = "ownership_pct", box = "F", label = "Ownership percentage", type = "percent", required = true },
  { id = "days_owned", box = "", label = "Days owned (if ownership changed)", type = "int" },
