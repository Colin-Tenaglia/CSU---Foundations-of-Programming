# Drake screen map — Form 1040
#
# Field order mirrors the IRS form box order, which is how Drake lays out its
# information-return screens. It has NOT been walked against a live Drake install.
# Do that once, correct anything that differs, then set verified = true and
# record the Drake year you checked against.
#
# Editing rules:
#   code       what you type in Drake's screen selector
#   order      the sequence the worksheet prints in — set it to your keying order
#   multi      true when you key one screen instance per source document
#   doc_types  must match the doc_type strings in drakeprep/classify.py
#   type       text | ein | ssn | money | date | code | checkbox | state | zip | percent | int
#              ssn and ein are masked in every printed worksheet

form = "1040"
tax_year = 2025
verified = false
source_note = "Box order transcribed from the IRS forms. Verify against Drake before keying."

# Figures used by the arithmetic checks in `prepdesk check`. Correct them for the
# year you are preparing — they are not updated automatically.
[limits]
ss_wage_base = 176100
ss_rate = 0.062
medicare_rate = 0.0145
medicare_additional_threshold_single = 200000
medicare_additional_threshold_mfj = 250000
capital_loss_ordinary_offset = 3000
salt_cap = 10000
medical_floor_pct = 0.075

# ---------------------------------------------------------------- demographics

[[screens]]
code = "1"
title = "Name and Address"
order = 1
wp_section = 100
doc_types = ["Identification", "Organizer"]
note = "Filing status drives nearly every limitation downstream. Confirm it against the organizer, not last year's return."
fields = [
  { id = "filing_status", box = "", label = "Filing status (1=S 2=MFJ 3=MFS 4=HOH 5=QSS)", type = "code", required = true },
  { id = "tp_ssn", box = "", label = "Taxpayer SSN", type = "ssn", required = true },
  { id = "tp_first", box = "", label = "Taxpayer first name", type = "text", required = true },
  { id = "tp_last", box = "", label = "Taxpayer last name", type = "text", required = true },
  { id = "tp_dob", box = "", label = "Taxpayer date of birth", type = "date", required = true },
  { id = "tp_occupation", box = "", label = "Taxpayer occupation", type = "text" },
  { id = "sp_ssn", box = "", label = "Spouse SSN", type = "ssn" },
  { id = "sp_first", box = "", label = "Spouse first name", type = "text" },
  { id = "sp_last", box = "", label = "Spouse last name", type = "text" },
  { id = "sp_dob", box = "", label = "Spouse date of birth", type = "date" },
  { id = "sp_occupation", box = "", label = "Spouse occupation", type = "text" },
  { id = "street", box = "", label = "Street address", type = "text", required = true },
  { id = "city", box = "", label = "City", type = "text", required = true },
  { id = "state", box = "", label = "State", type = "state", required = true },
  { id = "zip", box = "", label = "ZIP", type = "zip", required = true },
  { id = "resident_state", box = "", label = "Resident state (if different)", type = "state" },
